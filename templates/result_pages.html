<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detection Results</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <style>
        body {
            background: #f4f4f9;
            font-family: Arial, sans-serif;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-top: 50px;
            max-width: 800px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .summary {
            text-align: center;
            margin-bottom: 30px;
        }
        .summary p {
            font-size: 1.2rem;
            font-weight: bold;
            color: #555;
        }
        table {
            width: 100%;
            margin-top: 20px;
        }
        th, td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #007bff;
            color: white;
        }
        td {
            color: #333;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Detection Results</h1>

    <div class="summary">
        <p>Total Benign Packets: <span id="benign-count">0</span></p>
        <p>Total Malicious Packets: <span id="malicious-count">0</span></p>
    </div>

    <table class="table table-hover">
        <thead>
        <tr>
            <th>Flow ID</th>
            <th>Prediction</th>
        </tr>
        </thead>
        <tbody id="result-table">
        </tbody>
    </table>
</div>

<!-- Script to Inject Results -->
<script>
    // Ensure Flask safely renders JSON results
    const results = {{ results | tojson | safe }};

    // Update counts dynamically
    document.getElementById('benign-count').textContent = results['Benign Count'];
    document.getElementById('malicious-count').textContent = results['Malicious Count'];

    // Populate table rows dynamically
    const tableBody = document.getElementById('result-table');
    results['Predictions'].forEach(row => {
        const tableRow = document.createElement('tr');
        tableRow.innerHTML = `
            <td>${row['FLOW_ID']}</td>
            <td>${row['Prediction']}</td>
        `;
        tableBody.appendChild(tableRow);
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
